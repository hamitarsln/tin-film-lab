<!doctype html>
<meta charset="utf-8">
<!-- Minimal seek(t) film wired to the music. Copy this shape; replace the scenes. -->
<style>
  @font-face { font-family: "Funktional Grotesk"; src: url("../../refs/brand/fonts/FunktionalGrotesk-Medium.ttf"); font-weight: 500; }
  html, body { margin: 0; background: #F5F1E6; overflow: hidden; }
  canvas { display: block; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/motion.js"></script>
<script src="../../music/tools/music.js"></script>
<script src="music/cue.js"></script>
<script>
const { sp, clamp } = Motion;
const M = Music(window.CUE);
window.FILM = { duration: CUE.length, width: 1920, height: 1080 };
const g = document.getElementById('c').getContext('2d');
function draw(t) {
  const { bar, beat } = M.at(t);
  g.fillStyle = '#F5F1E6'; g.fillRect(0, 0, 1920, 1080);
  const drop = M.time(CUE.landing.film_bar);          // the drop, in film seconds
  const s = sp(t - drop, 'heavy');                     // the word lands on the drop with mass
  const punch = M.pulse(t, { every: 'beat', decay: 9 }) * (t >= drop ? 1 : 0.3);
  g.save(); g.translate(960, 540); g.scale(0.85 + 0.15 * s + 0.03 * punch, 0.85 + 0.15 * s + 0.03 * punch);
  g.fillStyle = '#080808'; g.font = '500 220px "Funktional Grotesk"'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.globalAlpha = clamp(s * 1.4); g.fillText('tin', 0, 0); g.restore();
  g.fillStyle = '#080808'; g.font = '500 28px ui-monospace, monospace';
  g.fillText(`bar ${bar} · beat ${beat} · bass ${M.env(t, 'low').toFixed(2)}`, 60, 1030);
}
window.seek = t => draw(t);
if (!new URLSearchParams(location.search).has('render')) {   // live preview in a normal browser
  const a = new Audio('music/music.wav'); const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % FILM.duration); requestAnimationFrame(loop); })();
}
</script>
