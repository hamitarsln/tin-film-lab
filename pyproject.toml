[project]
name = "tin-film-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beat-this",
    "imageio-ffmpeg>=0.6.0",
    "librosa==0.11.0",
    "matplotlib>=3.11.2",
    "numba==0.61.2",
    "numpy<2.3",
    "opencv-python-headless>=5.0.0.93",
    "rembg[cpu]>=2.0.69",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
beat-this = { git = "https://github.com/CPJKU/beat_this" }
